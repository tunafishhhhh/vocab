let lang='tr', activeTab='today', selectedLevel='ALL', dailyGoal=10, listQuery='', listStatus='ALL', pageNo=0, session=[], sessionIndex=0, isRevealed=false, isLoading=false, quiz=null, quizBusy=false, quizResult=null;
let state={};
const CACHE_KEY='lexipath3000_state_v1';
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function loadState(){try{const x=JSON.parse(localStorage.getItem(CACHE_KEY)||'{}');state={known:x.known||{},saved:x.saved||{},meaningCache:x.meaningCache||{},today:x.today===todayKey()?x.today:todayKey(),todayDone:x.today===todayKey()?(x.todayDone||[]):[],streak:x.streak||0,lastStudy:x.lastStudy||'',goal:x.goal||10};dailyGoal=state.goal; if(!state.meaningCache)state.meaningCache={}}catch(e){state={known:{},saved:{},meaningCache:{},today:todayKey(),todayDone:[],streak:0,lastStudy:'',goal:10};dailyGoal=10}}
function saveState(){try{state.goal=dailyGoal;state.today=todayKey();localStorage.setItem(CACHE_KEY,JSON.stringify(state))}catch(e){}}
function t(k){return (UI[lang]&&UI[lang][k])||UI.tr[k]||k}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function levelMatch(w,l=selectedLevel){return l==='ALL'||(w.levels||[w.level]).includes(l)}
function statusOf(w){const k=String(w.id);if(state.known[k]==='known')return 'known';if(state.known[k]==='review')return 'review';return 'new'}
function byId(id){return WORDS[Number(id)]}
WORDS.forEach((w,i)=>w.id=i);
function countKnown(){return Object.values(state.known).filter(x=>x==='known').length}
function countReview(){return Object.values(state.known).filter(x=>x==='review').length}
function countSaved(){return Object.values(state.saved).filter(Boolean).length}
function countToday(){return (state.todayDone||[]).length}
function todayStats(){let n=countToday(),g=dailyGoal;return `<strong>${n}<span style="font-size:14px;color:#839087;font-weight:600"> / ${g}</span></strong>`}
function toast(msg){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${safe(msg)}</div>`;setTimeout(()=>{root.innerHTML=''},2500)}
function updateSidebar(){document.getElementById('sideDone').textContent=countToday();document.getElementById('sideGoal').textContent=dailyGoal;document.getElementById('sideProgress').style.width=Math.min(100,countToday()/dailyGoal*100)+'%';document.getElementById('langToggle').textContent=lang==='tr'?'TR / EN':'EN / TR';document.querySelectorAll('[data-i]').forEach(n=>{let key=n.dataset.i;if(t(key))n.textContent=t(key)});document.getElementById('crumbCurrent').textContent=t(({today:'today',learn:'flashcards',list:'wordlist',quiz:'quickquiz',progress:'progress'})[activeTab]||'today');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab))}
function header(title,subtitle,kicker=''){return `<div class="page-title-row"><div><div class="eyebrow">${safe(kicker||'LEXIPATH 3000')}</div><h1>${safe(title)}</h1><p>${safe(subtitle)}</p></div></div>`}
function statCard(icon,label,value,foot){return `<div class="stat"><div class="stat-top"><span>${safe(label)}</span><span class="stat-symbol">${icon}</span></div><strong>${value}</strong><div class="stat-foot">${safe(foot)}</div></div>`}
function progressBar(pct){return `<div class="progress-track"><div class="progress-fill" style="width:${Math.max(0,Math.min(100,pct))}%"></div></div>`}
function getStudyPool(){let pool=WORDS.filter(w=>levelMatch(w));let review=pool.filter(w=>statusOf(w)==='review');let fresh=pool.filter(w=>statusOf(w)==='new');let known=pool.filter(w=>statusOf(w)==='known');let mix=[...review,...fresh,...known];return mix}
function startSession(firstId){let pool=getStudyPool();if(!pool.length)pool=[...WORDS];if(firstId!==undefined){const first=byId(firstId);pool=pool.filter(w=>w.id!==first.id);pool.unshift(first)}session=pool;sessionIndex=0;isRevealed=false;isLoading=false;activeTab='learn';render()}
function curWord(){if(!session.length)session=getStudyPool();return session[Math.max(0,Math.min(sessionIndex,session.length-1))]||WORDS[0]}
async function fetchWordData(w){const key=String(w.word).toLowerCase();if(state.meaningCache[key]&&state.meaningCache[key].loaded)return state.meaningCache[key];let result={loaded:true,translation:'',definitions:[],examples:[],phonetic:''};const enc=encodeURIComponent(w.word.toLowerCase());const requests=[fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(w.word)+'&langpair=en%7Ctr').then(r=>r.ok?r.json():Promise.reject()).then(j=>{if(j.responseStatus===200&&j.responseData&&j.responseData.translatedText)result.translation=cleanTranslation(j.responseData.translatedText)}).catch(()=>{}),fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+enc).then(r=>r.ok?r.json():Promise.reject()).then(j=>{const entry=Array.isArray(j)?j[0]:null;if(entry){result.phonetic=entry.phonetic||(entry.phonetics||[]).find(p=>p.text)?.text||'';for(const m of entry.meanings||[])for(const d of m.definitions||[]){if(d.definition&&result.definitions.length<2)result.definitions.push({pos:m.partOfSpeech,definition:d.definition});if(d.example&&result.examples.length<1)result.examples.push(d.example)}}}).catch(()=>{})];await Promise.all(requests);state.meaningCache[key]=result;saveState();return result}
function cleanTranslation(s){return String(s||'').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&').replace(/\s+/g,' ').trim()}
function drawWordReveal(w,data,mode='card'){const hasMeaning=Boolean(data&&(data.translation||data.definitions.length||data.examples.length));let html='';if(isLoading&&mode==='card')return `<div class="translation-area"><p class="translation">${safe(t('translationLoading'))}</p><p class="def">${safe(t('definitionLoading'))}</p></div>`;if(!hasMeaning)return `<div class="translation-area"><p class="def">${safe(t('noMeaning'))}</p><p class="def"><a style="color:#d4f3b3" target="_blank" rel="noopener" href="https://www.oxfordlearnersdictionaries.com/definition/american_english/${encodeURIComponent(w.word.toLowerCase().replace(/\s+/g,'_'))}">${safe(t('dictionaryLink'))}</a></p></div>`;if(data.translation)html+=`<p class="translation">${safe(data.translation)}</p>`;if(data.definitions.length)html+=data.definitions.map(d=>`<p class="def"><strong>${safe(d.pos||'')}</strong> ${safe(d.definition)}</p>`).join('');if(data.examples.length)html+=`<p class="example">“${safe(data.examples[0])}”</p>`;return `<div class="translation-area">${html}<div style="font-size:10px;color:#9fb6a5;margin-top:9px">${safe(t('translationSource'))}</div></div>`}
function renderToday(){const w=(session.length?curWord():getStudyPool()[0])||WORDS[0];const st=statusOf(w), dat=state.meaningCache[String(w.word).toLowerCase()];const pct=Math.min(100,countToday()/dailyGoal*100);const topWords=WORDS.filter(x=>state.known[String(x.id)]==='review').slice(0,3);const saved=WORDS.filter(x=>state.saved[String(x.id)]).slice(0,3);const mini=topWords.length?topWords:saved.length?saved:WORDS.filter(x=>statusOf(x)==='new'&&levelMatch(x,'A1')).slice(0,3);return `<div class="hello-row"><div><div class="eyebrow">${safe(t('todayDate'))}</div><h1>${safe(t('heroTitle'))}</h1><p>${safe(t('heroSub'))}</p></div><div class="day-chip">✦ ${new Date().toLocaleDateString(lang==='tr'?'tr-TR':'en-US',{weekday:'short',month:'short',day:'numeric'})}</div></div><div class="stats">${statCard('▦',t('allWords'),WORDS.length.toLocaleString(),t('fromList'))}${statCard('✓',t('mastered'),countKnown().toLocaleString(),t('lifetime'))}${statCard('☆',t('saved'),countSaved().toLocaleString(),t('lifetime'))}${statCard('♨',t('streak'),state.streak+'',t('days'))}</div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><div><h2>${safe(t('todaySession'))}</h2><p>${safe(t('smartReview'))}</p></div><button class="section-link" data-action="go-tab" data-target="learn">${safe(t('continueLearning'))} →</button></div><div class="learning-hero"><div class="word-card"><div class="word-card-top"><div style="display:flex;align-items:center;gap:9px"><span class="level-tag">${safe((w.levels||[w.level]).join(' / '))}</span><span class="pos-tag">${safe(w.pos)}</span></div><div class="card-actions"><button class="icon-btn" title="${safe(t('pronunciation'))}" data-action="speak" data-id="${w.id}">♫</button><button class="icon-btn ${state.saved[String(w.id)]?'on':''}" title="${safe(t('save'))}" data-action="save" data-id="${w.id}">☆</button></div></div><div class="word-title">${safe(w.word)}</div><p class="word-pron">${safe(dat?.phonetic||'American English')}</p>${isRevealed?drawWordReveal(w,dat,'card'):`<p class="reveal-hint">${safe(t('reveal'))} — ${safe(t('tip1d'))}</p>`}<div class="card-bottom"><div class="button-row">${isRevealed?`<button class="btn btn-white" data-action="known" data-id="${w.id}">${safe(t('iKnow'))} ✓</button><button class="btn btn-outline" data-action="review" data-id="${w.id}">${safe(t('reviewAgain'))}</button><button class="btn btn-outline" data-action="next">${safe(t('nextWord'))}</button>`:`<button class="btn btn-primary" data-action="reveal">${safe(t('reveal'))} ↗</button><button class="btn btn-outline" data-action="next">${safe(t('randomCard'))} ↗</button>`}</div><span class="card-index">${st==='known'?'✓ '+safe(t('statusKnown')):st==='review'?'↻ '+safe(t('statusLearning')):safe(t('statusNew'))}</span></div></div></div></section><div class="dashboard-side"><section class="panel goal-panel"><div class="goal-head"><h2>${safe(t('goalTitle'))}</h2><span class="goal-icon">◎</span></div><div class="goal-value"><strong>${countToday()}</strong><span>${safe(t('words'))} / ${dailyGoal}</span></div>${progressBar(pct)}<p class="goal-note">${pct>=100?safe(t('goalReached')):`${Math.max(0,dailyGoal-countToday())} ${safe(t('toGoal'))}`}</p><div class="eyebrow" style="margin-bottom:9px">${safe(t('setGoal'))}</div><div class="goal-options">${[5,10,20].map(n=>`<button data-action="goal" data-value="${n}" class="${dailyGoal===n?'active':''}">${n} ${safe(t('words'))}</button>`).join('')}</div></section><section class="panel mini-panel"><div class="panel-head"><div><h2>${safe(t('quickAccess'))}</h2><p>${safe(t('reviewDue'))}</p></div><button class="section-link" data-action="go-tab" data-target="list">${safe(t('viewAll'))}</button></div><div class="mini-list">${mini.length?mini.map(x=>`<div class="mini-word"><div class="letter-tile">${safe(x.word.slice(0,1).toUpperCase())}</div><div class="mini-word-main"><strong>${safe(x.word)}</strong><span>${safe((x.levels||[x.level]).join(' / '))} · ${safe(x.pos)}</span></div><span class="mini-status">${safe(statusLabel(statusOf(x)))}</span></div>`).join(''):`<div class="empty">${safe(t('noWords'))}</div>`}</div></section></div></div><section class="panel activity-panel"><div class="panel-head"><div><h2>${safe(t('studyTipTitle'))}</h2><p>${safe(t('learningPathD'))}</p></div></div><div class="activity-content"><div class="activity-item"><div class="activity-icon">↻</div><div><strong>${safe(t('tip1'))}</strong><p>${safe(t('tip1d'))}</p></div></div><div class="activity-item"><div class="activity-icon">◷</div><div><strong>${safe(t('tip2'))}</strong><p>${safe(t('tip2d'))}</p></div></div><div class="activity-item"><div class="activity-icon">♫</div><div><strong>${safe(t('tip3'))}</strong><p>${safe(t('tip3d'))}</p></div></div><div class="activity-item"><div class="activity-icon">↗</div><div><strong>${safe(t('learningPath'))}</strong><p>${safe(t('learningPathD'))}</p></div></div></div></section>${footer()}</div>`}
function statusLabel(s){return s==='known'?t('statusKnown'):s==='review'?t('statusLearning'):t('statusNew')}
function filteredWords(){let q=listQuery.trim().toLowerCase();return WORDS.filter(w=>{let match=(!q||w.word.toLowerCase().includes(q)||w.pos.toLowerCase().includes(q));let lev=levelMatch(w,selectedLevel);let st=listStatus==='ALL'||(listStatus==='SAVED'?state.saved[String(w.id)]:(statusOf(w)===listStatus.toLowerCase()));return match&&lev&&st})}
function renderList(){let all=filteredWords(),pageSize=35,maxPage=Math.max(0,Math.ceil(all.length/pageSize)-1);pageNo=Math.max(0,Math.min(pageNo,maxPage));let shown=all.slice(pageNo*pageSize,(pageNo+1)*pageSize);return `${header(t('wordLibraryTitle'),t('wordLibrarySub'), '3000 WORDS · A1–B2')}<div class="filters"><div class="search-wrap"><span>⌕</span><input class="search" id="wordSearch" value="${safe(listQuery)}" placeholder="${safe(t('searchPlaceholder'))}"></div><select class="select" id="levelSelect" aria-label="${safe(t('chooseLevel'))}"><option value="ALL">${safe(t('allLevels'))}</option>${['A1','A2','B1','B2'].map(l=>`<option value="${l}" ${selectedLevel===l?'selected':''}>${l}</option>`).join('')}</select><select class="select" id="statusSelect" aria-label="${safe(t('allStatuses'))}"><option value="ALL">${safe(t('allStatuses'))}</option><option value="new" ${listStatus==='new'?'selected':''}>${safe(t('statusNew'))}</option><option value="review" ${listStatus==='review'?'selected':''}>${safe(t('statusLearning'))}</option><option value="known" ${listStatus==='known'?'selected':''}>${safe(t('statusKnown'))}</option><option value="SAVED" ${listStatus==='SAVED'?'selected':''}>${safe(t('statusSaved'))}</option></select></div><div class="word-table"><div class="word-table-head"><span>${safe(t('word'))}</span><span>${safe(t('level'))}</span><span>${safe(t('status'))}</span><span style="text-align:right">${safe(t('actions'))}</span></div>${shown.length?shown.map(w=>`<div class="word-row"><div class="row-word"><strong>${safe(w.word)}</strong><small>${safe(w.pos)}</small></div><div class="level-cell"><span class="level-pill">${safe((w.levels||[w.level]).join(' / '))}</span></div><div class="status-cell row-status">${safe(statusLabel(statusOf(w)))}</div><div class="row-actions"><button class="mini-action" data-action="study-id" data-id="${w.id}">${safe(t('study'))}</button><button class="mini-action" title="${safe(t('save'))}" data-action="save" data-id="${w.id}">${state.saved[String(w.id)]?'★':'☆'}</button></div></div>`).join(''):`<div class="empty">${safe(t('noResults'))}</div>`}<div class="table-foot"><span>${safe(t('showing'))} ${all.length?pageNo*pageSize+1:0}–${Math.min(all.length,(pageNo+1)*pageSize)} ${safe(t('of'))} ${all.length} ${safe(t('results'))}</span><div class="pagination"><button data-action="page" data-dir="-1" ${pageNo===0?'disabled':''}>${safe(t('previous'))}</button><button data-action="page" data-dir="1" ${pageNo>=maxPage?'disabled':''}>${safe(t('next'))}</button></div></div></div>${footer()}</div>`}
function renderLearn(){let w=curWord(),dat=state.meaningCache[String(w.word).toLowerCase()],pct=session.length?Math.round((sessionIndex+1)/session.length*100):0;return `${header(t('flashTitle'),t('flashSub'),'ACTIVE RECALL · SPACED REVIEW')}<div class="learn-layout"><section class="study-stage"><div class="stage-heading"><span>${safe(t('sessionLabel'))}</span><span>${safe(t('cardCount'))} ${Math.min(sessionIndex+1,session.length||1)} / ${session.length||1}</span></div><div class="stage-meter"><div style="width:${pct}%"></div></div><div class="word-card-top"><div style="display:flex;gap:9px;align-items:center"><span class="level-tag">${safe((w.levels||[w.level]).join(' / '))}</span><span class="pos-tag">${safe(w.pos)}</span></div><div class="card-actions"><button class="icon-btn" data-action="speak" data-id="${w.id}" title="${safe(t('pronunciation'))}">♫</button><button class="icon-btn ${state.saved[String(w.id)]?'on':''}" data-action="save" data-id="${w.id}" title="${safe(t('save'))}">☆</button></div></div><h2 class="study-word">${safe(w.word)}</h2><div class="study-pron">${safe(dat?.phonetic||'American English')}</div>${isRevealed?`<div class="study-meaning">${drawWordReveal(w,dat,'study')}</div>`:`<p style="color:#c1d2c7;font-size:13px;margin-top:22px">${safe(t('reveal'))}. ${safe(t('tip1d'))}</p>`}<div class="stage-controls">${isRevealed?`<button class="btn btn-primary" data-action="known" data-id="${w.id}">${safe(t('markKnown'))}</button><button class="btn btn-outline" data-action="review" data-id="${w.id}">${safe(t('markReview'))}</button>`:`<button class="btn btn-primary" data-action="reveal">${safe(t('reveal'))} ↗</button>`}<button class="btn btn-outline" data-action="prev-card">${safe(t('previousCard'))}</button><button class="btn btn-outline" data-action="next">${safe(t('nextWord'))}</button></div></section><div style="display:grid;gap:17px;align-content:start"><section class="panel side-panel"><h2>${safe(t('studyOptions'))}</h2><p>${safe(t('chooseLevel'))}</p><div class="goal-options">${['ALL','A1','A2','B1','B2'].map(l=>`<button data-action="level" data-value="${l}" class="${selectedLevel===l?'active':''}">${l==='ALL'?safe(t('allLevels')):l}</button>`).join('')}</div><div style="margin-top:14px"><button class="btn btn-light" style="width:100%" data-action="random-card">↻ ${safe(t('randomCard'))}</button></div></section><section class="panel side-panel"><h2>${safe(t('learnTips'))}</h2>${[['1',t('tip1'),t('tip1d')],['2',t('tip2'),t('tip2d')],['3',t('tip3'),t('tip3d')]].map(a=>`<div class="tip-row"><div class="tip-dot">${a[0]}</div><div><strong>${safe(a[1])}</strong><span>${safe(a[2])}</span></div></div>`).join('')}</section></div></div>${footer()}</div>`}
async function setReveal(){const w=curWord();isRevealed=true;isLoading=true;render();const dat=await fetchWordData(w);isLoading=false;render()}
function markStatus(id,status){let k=String(id);if(status==='known'){state.known[k]='known';if(!state.todayDone.includes(k)){state.todayDone.push(k);recordStudyDay()}toast(t('knownToast'))}else{state.known[k]='review';toast(t('reviewToast'))}saveState();advanceCard();render()}
function recordStudyDay(){let now=todayKey();if(state.lastStudy!==now){let last=state.lastStudy?new Date(state.lastStudy+'T00:00:00'):null;let today=new Date(now+'T00:00:00');if(last&&Math.round((today-last)/86400000)===1)state.streak=(state.streak||0)+1;else if(!last||state.lastStudy!==now)state.streak=1;state.lastStudy=now}}
function advanceCard(){if(!session.length)session=getStudyPool();sessionIndex=(sessionIndex+1)%session.length;isRevealed=false;isLoading=false}
function makeQuiz(){let pool=WORDS.filter(w=>levelMatch(w)&&statusOf(w)!=='known');if(pool.length<4)pool=WORDS.filter(w=>levelMatch(w));if(pool.length<4)pool=WORDS;let word=pool[Math.floor(Math.random()*pool.length)];const opts=[word];while(opts.length<4){const x=pool[Math.floor(Math.random()*pool.length)];if(!opts.some(o=>o.id===x.id))opts.push(x)}opts.sort(()=>Math.random()-.5);quiz={word,options:opts};quizResult=null;quizBusy=true;render();fetchWordData(word).then(()=>{quizBusy=false;render()})}
function renderQuiz(){if(!quiz)makeQuiz();let w=quiz.word,dat=state.meaningCache[String(w.word).toLowerCase()];const prompt=dat?.translation||t('checking');return `${header(t('quizTitle'),t('quizSub'),'RETRIEVAL PRACTICE')}<div class="quiz-wrap"><div class="quiz-shell"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="level-pill">${safe((w.levels||[w.level]).join(' / '))}</span><span style="font-size:11px;color:#87938b">${safe(t('question'))}</span></div><div class="quiz-progress"><div style="width:${quizResult?100:35}%"></div></div><div class="quiz-prompt-label">${safe(t('whichWord'))}</div><div class="quiz-prompt">${quizBusy?safe(t('checking')):safe(prompt)}</div><div class="quiz-options">${quiz.options.map((o,i)=>`<button class="quiz-option ${quizResult?(o.id===w.id?'correct':quizResult.chosen===o.id?'wrong':''):''}" data-action="answer" data-id="${o.id}" ${quizBusy||quizResult?'disabled':''}><span>${String.fromCharCode(65+i)}</span>${safe(o.word)}</button>`).join('')}</div>${quizResult?`<div class="quiz-feedback">${quizResult.chosen===w.id?'✓ '+safe(t('correct')):'↻ '+safe(t('incorrect'))+' <strong>'+safe(w.word)+'</strong>'}${dat?.definitions?.[0]?.definition?'<br><span style="display:block;margin-top:5px">'+safe(dat.definitions[0].definition)+'</span>':''}</div>`:''}<div class="quiz-footer"><small>${safe(t('quizNote'))}</small>${quizResult?`<button class="btn btn-dark" data-action="next-quiz">${safe(t('nextQuestion'))}</button>`:''}</div></div></div>${footer()}</div>`}
function renderProgress(){const levels=['A1','A2','B1','B2'];const levelData=levels.map(l=>{const items=WORDS.filter(w=>(w.levels||[w.level]).includes(l));const known=items.filter(w=>statusOf(w)==='known').length;return {l,total:items.length,known,pct:Math.round(known/items.length*100)}});const total=WORDS.length,known=countKnown(),pct=Math.round(known/total*100);return `${header(t('progressTitle'),t('progressSub'),'YOUR LEARNING DASHBOARD')}<div class="progress-grid"><section class="panel progress-card"><h2>${safe(t('overall'))}</h2><p>${safe(t('overallCopy'))}</p><div class="big-progress"><div class="ring" style="--progress:${pct}%"><div class="ring-content"><strong>${pct}%</strong><span>${safe(t('overall'))}</span></div></div><div><strong style="font-size:23px">${known.toLocaleString()} / ${total.toLocaleString()}</strong><p>${safe(t('wordsKnown'))}</p><span class="level-pill">${total-known} ${safe(t('statusNew').toLowerCase())}</span></div></div>${progressBar(pct)}</section><section class="panel progress-card"><h2>${safe(t('yourHabits'))}</h2><p>${safe(t('dailyProgress'))}</p><div class="mini-list" style="padding:0">${[[t('wordsKnown'),known,'✓'],[t('wordsSaved'),countSaved(),'☆'],[t('reviewCount'),countReview(),'↻'],[t('dailyDone'),countToday(),'◷']].map((r,i)=>`<div class="mini-word"><div class="letter-tile">${r[2]}</div><div class="mini-word-main"><strong>${safe(r[0])}</strong><span>${safe(i===3?t('todayDate'):t('lifetime'))}</span></div><strong>${r[1]}</strong></div>`).join('')}</div></section><section class="panel progress-card" style="grid-column:1/-1"><h2>${safe(t('byLevel'))}</h2><p>${safe(t('byLevelSub'))}</p><div class="level-bar-list">${levelData.map(d=>`<div class="level-bar-item"><strong>${d.l}</strong>${progressBar(d.pct)}<small>${d.known} / ${d.total}</small></div>`).join('')}</div></section><section class="panel progress-card" style="grid-column:1/-1"><h2>${safe(t('aboutTitle'))}</h2><p>${safe(t('aboutText'))}</p><p style="margin:0">${safe(t('disclaimer'))}</p><p style="margin-top:12px">${safe(t('offline'))}</p><button class="btn btn-quiet" data-action="reset" style="margin-top:10px">${safe(t('reset'))}</button></section></div>${footer()}</div>`}
function footer(){return `<div class="footer-note">${safe(t('offline'))}<br>${safe(t('disclaimer'))}<br>${safe(t('translationSource'))} · <a href="https://api.dictionaryapi.dev/" target="_blank" rel="noopener">Free Dictionary API</a></div>`}
function render(){updateSidebar();const main=document.getElementById('mainContent');if(activeTab==='today')main.innerHTML=renderToday();else if(activeTab==='learn')main.innerHTML=renderLearn();else if(activeTab==='list')main.innerHTML=renderList();else if(activeTab==='quiz')main.innerHTML=renderQuiz();else main.innerHTML=renderProgress()}
function setTab(tab){activeTab=tab;document.getElementById('sidebar').classList.remove('open');if(tab==='learn'&&!session.length){session=getStudyPool();sessionIndex=0;isRevealed=false}if(tab==='quiz'&&!quiz)makeQuiz();render()}
function speak(id){const w=byId(id);if(!w)return;if(!('speechSynthesis'in window)){toast(t('loadError'));return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.word);u.lang='en-US';u.rate=.88;window.speechSynthesis.speak(u)}
function toggleSave(id){let k=String(id);if(state.saved[k]){delete state.saved[k];toast(t('wordUnsaved'))}else{state.saved[k]=true;toast(t('wordSaved'))}saveState();render()}
function answerQuiz(id){if(quizBusy||quizResult)return;quizResult={chosen:Number(id)};if(Number(id)===quiz.word.id){state.known[String(quiz.word.id)]='known';if(!state.todayDone.includes(String(quiz.word.id))){state.todayDone.push(String(quiz.word.id));recordStudyDay()}}else state.known[String(quiz.word.id)]='review';saveState();render()}
function nextQuiz(){makeQuiz()}
function setLevel(l){selectedLevel=l;pageNo=0;if(activeTab==='learn'){session=getStudyPool();sessionIndex=0;isRevealed=false}render()}
function handleAction(btn){const a=btn.dataset.action,id=btn.dataset.id;if(a==='menu'){document.getElementById('sidebar').classList.toggle('open');return}if(a==='toggle-lang'){lang=lang==='tr'?'en':'tr';render();return}if(a==='go-tab'){setTab(btn.dataset.target);return}if(a==='reveal'){setReveal();return}if(a==='known'){markStatus(id,'known');return}if(a==='review'){markStatus(id,'review');return}if(a==='next'){advanceCard();render();return}if(a==='prev-card'){sessionIndex=Math.max(0,sessionIndex-1);isRevealed=false;render();return}if(a==='study-id'){startSession(id);return}if(a==='save'){toggleSave(id);return}if(a==='speak'){speak(id);return}if(a==='goal'){dailyGoal=Number(btn.dataset.value);saveState();toast(t('goalSaved'));render();return}if(a==='level'){setLevel(btn.dataset.value);return}if(a==='page'){pageNo+=Number(btn.dataset.dir);render();return}if(a==='answer'){answerQuiz(id);return}if(a==='next-quiz'){nextQuiz();return}if(a==='random-card'){let pool=WORDS.filter(w=>levelMatch(w));const w=pool[Math.floor(Math.random()*pool.length)];startSession(w.id);return}if(a==='reset'){if(confirm(t('resetConfirm'))){state.known={};state.saved={};state.todayDone=[];state.streak=0;state.lastStudy='';saveState();toast(t('resetDone'));render()}return}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-tab]');if(nav){setTab(nav.dataset.tab);return}const b=e.target.closest('[data-action]');if(b){handleAction(b);return}});
document.addEventListener('change',e=>{if(e.target.id==='levelSelect'){selectedLevel=e.target.value;pageNo=0;render()}if(e.target.id==='statusSelect'){listStatus=e.target.value;pageNo=0;render()}});
document.addEventListener('input',e=>{if(e.target.id==='wordSearch'){const pos=e.target.selectionStart;listQuery=e.target.value;pageNo=0;const main=document.getElementById('mainContent');main.innerHTML=renderList();const input=document.getElementById('wordSearch');input.focus();input.setSelectionRange(pos,pos)}});
loadState();
// Keep the local progress reset on a new calendar day while preserving long-term learning status.
if(state.today!==todayKey()){state.today=todayKey();state.todayDone=[];saveState()}
session=getStudyPool();render();
</script>
</body></html>
